{% extends 'base.html' %}{% block title %}Edit Expense{% endblock %}{% block content %}
<div class="card formcard"><h1>Edit Expense</h1><form method="post"><label>Category<select name="category">{% for c in categories %}<option value="{{c.category_id}}" {% if c.category_id==expense.category_id %}selected{% endif %}>{{c.category_name}}</option>{% endfor %}</select></label><label>Payment Mode<select name="mode">{% for m in modes %}<option value="{{m.payment_mode_id}}" {% if m.payment_mode_id==expense.payment_mode_id %}selected{% endif %}>{{m.mode_name}}</option>{% endfor %}</select></label><label>Amount<input name="amount" type="number" step="0.01" min="0.01" value="{{expense.amount}}" required></label><label>Description<input name="description" value="{{expense.description or ''}}"></label><label>Date<input name="expense_date" type="date" value="{{expense.expense_date}}" required></label><button>Update Expense</button></form></div>{% endblock %}
