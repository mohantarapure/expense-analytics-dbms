{% extends 'base.html' %}{% block title %}Add Expense{% endblock %}{% block content %}
<div class="card formcard"><h1>Add Expense</h1><form method="post"><label>Category<select name="category" required>{% for c in categories %}<option value="{{c.category_id}}">{{c.category_name}}</option>{% endfor %}</select></label><label>Payment Mode<select name="mode" required>{% for m in modes %}<option value="{{m.payment_mode_id}}">{{m.mode_name}}</option>{% endfor %}</select></label><label>Amount<input name="amount" type="number" step="0.01" min="0.01" required></label><label>Description<input name="description"></label><label>Date<input name="expense_date" type="date" value="{{today}}" required></label><button>Save Expense</button></form></div>{% endblock %}
