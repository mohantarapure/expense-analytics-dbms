{% extends 'base.html' %}{% block title %}Master Data{% endblock %}{% block content %}
<div class="card"><h1>Master Data Management</h1><form class="rowform" method="post"><select name="type"><option value="category">Category</option><option value="mode">Payment Mode</option></select><input name="name" placeholder="New name" required><button>Add</button></form></div>
<div class="grid two"><div class="card"><h2>Categories</h2><table><tr><th>Name</th><th>Action</th></tr>{% for c in categories %}<tr><td>{{c.category_name}}</td><td><form method="post" action="{{url_for('delete_master',typ='category',item_id=c.category_id)}}"><button class="danger">Delete</button></form></td></tr>{% endfor %}</table></div>
<div class="card"><h2>Payment Modes</h2><table><tr><th>Name</th><th>Action</th></tr>{% for m in modes %}<tr><td>{{m.mode_name}}</td><td><form method="post" action="{{url_for('delete_master',typ='mode',item_id=m.payment_mode_id)}}"><button class="danger">Delete</button></form></td></tr>{% endfor %}</table></div></div>{% endblock %}
